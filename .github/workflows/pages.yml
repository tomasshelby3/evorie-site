name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Inter fonts
        run: |
          set -euo pipefail
          mkdir -p fonts
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -qo /tmp/inter.zip -d /tmp/inter
          cp "$(find /tmp/inter -name 'Inter-Regular.ttf' | head -1)" fonts/Inter-400.ttf
          cp "$(find /tmp/inter -name 'Inter-Medium.ttf' | head -1)" fonts/Inter-500.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" fonts/Inter-600.ttf
          cp "$(find /tmp/inter -name 'Inter-Bold.ttf' | head -1)" fonts/Inter-700.ttf
          cp "$(find /tmp/inter -name 'Inter-ExtraBold.ttf' | head -1)" fonts/Inter-800.ttf
      - name: Decode images
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import base64
          img = Path('img')
          for name in ['diplom.jpg','director-site.jpg','director.jpg','team-congress-v.jpg','team-congress.jpg']:
              parts = sorted(img.glob(f'{name}.b64.p*'))
              if parts:
                  data = ''.join(p.read_text() for p in parts)
                  for p in parts:
                      p.unlink()
              else:
                  p = img / f'{name}.b64'
                  if not p.exists():
                      print('MISSING', name)
                      continue
                  data = p.read_text()
                  p.unlink()
              out = img / name
              out.write_bytes(base64.b64decode(data))
              print('wrote', out, out.stat().st_size)
          Path('test.bin').unlink(missing_ok=True)
          Path('.nojekyll').write_text('')
          Path('CNAME').write_text('evorie.ru\n')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
