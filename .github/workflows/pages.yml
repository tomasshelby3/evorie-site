name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build _site
        run: |
          set -euo pipefail
          mkdir -p _site/fonts _site/img
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -qo /tmp/inter.zip -d /tmp/inter
          for w in "400 Regular" "500 Medium" "600 SemiBold" "700 Bold" "800 ExtraBold"; do
            set -- $w
            cp "$(find /tmp/inter -name "Inter-$2.ttf" | head -1)" "_site/fonts/Inter-$1.ttf"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, shutil
          src, dst = Path('img'), Path('_site/img')
          for p in sorted(src.iterdir()):
              if p.name.endswith('.b64'):
                  data = re.sub(r'\s+', '', p.read_text())
                  if len(data) % 4 == 1:
                      data = data[:-1]
                  data += '=' * ((-len(data)) % 4)
                  out = dst / p.name[:-4]
                  out.write_bytes(base64.b64decode(data))
                  print('wrote', out, out.stat().st_size)
              elif p.suffix in ('.svg', '.jpg', '.png', '.webp'):
                  shutil.copy(p, dst / p.name)
          for f in ('index.html', 'style.css'):
              shutil.copy(f, Path('_site') / f)
          Path('_site/.nojekyll').write_text('')
          Path('_site/CNAME').write_text('evorie.ru\n')
          PY
          ls -laR _site
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: evorie.ru
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
